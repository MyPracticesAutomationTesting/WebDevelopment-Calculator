<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project - Calculator</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="calculator-container">
        <div class="display-screen">
            <div class="display-as-entered"></div>
            <input id="input-text" type="text" autofocus>
        </div>
        <div class="buttons-containers">
            <div class="buttons">
                <button class="unary">%</button>
                <button class="clear-entry">CE</button>
                <button class="clear-all">C</button>
                <button class="back-space"><</button>
            </div>
            <div class="buttons">
                <button class="unary">
                    <span class=superscript>1</span>
                    /x
                </button>
                <button class="unary">
                    x<span class="superscript">2</span>
                </button>
                <button class="unary">
                    <span class=superscript>2</span>
                    &radic;<span class="sqrt-line">x</span>
                </button>
                <button class="operator divide">÷</button>
            </div>
            <div class="buttons">
                <button class="number">7</button>
                <button class="number">8</button>
                <button class="number">9</button>
                <button class="operator multiply">x</button>
            </div>
            <div class="buttons">
                <button class="number">4</button>
                <button class="number">5</button>
                <button class="number">6</button>
                <button class="operator" subtract>-</button>
            </div>
            <div class="buttons">
                <button class="number">1</button>
                <button class="number">2</button>
                <button class="number">3</button>
                <button class="operator add" >+</button>
            </div>
            <div class="buttons">
                <button class="unary">
                    <span class="superscript">+</span>
                    /-
                </button>
                <button class="number">0</button>
                <button class="number">.</button>
                <button class="equals">=</button>
            </div>
        </div>

    </div>

    <script type="module" src="./script.js"></script>
</body>
</html>
